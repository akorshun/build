name: "Probe: can a workflow create a release here"

# Throwaway. The tagged build got 403 on POST /releases while attaching an
# asset worked, and the same token creates releases fine in another fork of
# this account - so "forks cannot" is not the explanation. Narrow it down.
# Delete once answered.

# workflow_dispatch is only offered for workflows on the default branch, and
# this one lives on a board branch, so it runs on a push that touches itself.
on:
  push:
    branches: [friendlyelec-nanopi-r28s]
    paths: ['.github/workflows/probe-release-perm.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Make a tag first, the way the real run had one
        run: |
          set +e
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/probe-perm-c -f sha="${GITHUB_SHA}" > /dev/null 2>/tmp/tag.err
          echo "create tag exit=$?"
          head -3 /tmp/tag.err 2>/dev/null

      - name: gh release create on that existing tag, with --target
        run: |
          set +e
          printf 'probe\n' > /tmp/n.md
          gh release create probe-perm-c --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "probe c" --notes-file /tmp/n.md
          echo "exit=$?"

      - name: gh release create on a tag that does not exist yet
        run: |
          set +e
          gh release create probe-perm-d --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "probe d" --notes "probe"
          echo "exit=$?"

      - name: Clean up whatever got created
        if: always()
        run: |
          set +e
          for t in probe-perm-a probe-perm-b probe-perm-c probe-perm-d; do
            gh release delete "$t" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag 2>&1 | sed "s/^/[$t] /"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$t" >/dev/null 2>&1
          done
          exit 0
